# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_stages: [pre-commit]

default_language_version:
    python: python3.12

exclude: ^(flowers|scripts_bash)/

repos:

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        description: "Prevent giant files from being committed."
      - id: check-ast
        description: "Check whether files parse as valid python."
      - id: check-case-conflict
        description: "Check for filenames that would conflict on a case-insensitive filesystem."
      - id: check-docstring-first
        description: "Check for a common error of placing code before the docstring."
      - id: check-merge-conflict
        args: [--assume-in-merge]
        description: "Check for files that contain merge conflict strings."
      - id: check-toml
        description: "Check TOML files and verify syntax."
      - id: check-yaml
        description: "Check YAML files and verify syntax."
      - id: debug-statements
        description: "Check for debugger imports and breakpoint calls."
      - id: end-of-file-fixer
        description: "Check files end in a newline and only a newline."
      - id: mixed-line-ending
        description: "Replace or check mixed line ending."
      - id: name-tests-test
        args: [--pytest-test-first]
        description: "Verify that test files are named correctly."
      - id: pretty-format-json
        args: [--autofix]
        description: "Check that all your JSON files are pretty (keys are sorted and indented)."
      - id: trailing-whitespace
        description: "Trim trailing whitespace."

  # uv
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.13
    hooks:
      - id: uv-lock
        description: "Check uv.lock file is up to date."

  # Commit messages
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: ["bug", "build", "ci", "docs", "feat", "refactor", "test"]
        description: "Check commit messages for Conventional Commits formatting."

  # Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
        description: "Run Ruff as a linter."
      # Run the formatter.
      - id: ruff-format
        description: "Run Ruff as a formatter."
