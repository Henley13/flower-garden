name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docker-dev-cpu:
    name: Build dev image (CPU)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:dev-cpu-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --target dev \
            --build-arg DEVICE=cpu \
            --build-arg HOST_GID="$(id -g)" \
            --build-arg HOST_UID="$(id -u)" \
            --tag "${{ steps.image.outputs.image }}" \
            .

      - name: Push Docker image
        run: docker push "${{ steps.image.outputs.image }}"

  pre-commit:
    name: Run pre-commit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: docker-dev-cpu
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Pull Docker image
        run: docker pull "${{ needs.docker-dev-cpu.outputs.image }}"

      - name: Run pre-commit
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/app" \
            "${{ needs.docker-dev-cpu.outputs.image }}" \
            uv run pre-commit run --all-files
