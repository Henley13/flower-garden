name: "Feature Request"
description: Suggest a new feature for the project.
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: Please describe the feature you would like to see implemented.
      placeholder: Clear and concise description of the feature...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Implementation"
      description: Please describe your proposed implementation.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: "Proposed Usage"
      description: Please describe how the feature will be used.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: How important is this feature to you?
      options:
        - Low (nice to have)
        - Medium (would improve experience)
        - High (significantly needed)
        - Critical (blocking my usage)
    validations:
      required: false
